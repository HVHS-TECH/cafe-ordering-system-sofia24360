<!DOCTYPE html>
<html>
<head>
<title>KIKI'S KAFE</title>
<link href="style.css" rel="stylesheet">
<link rel="icon" type="png" href="Images/icon.webp">
</head>
<body>

<header>
   <div class="header">
      <h1>WELCOME TO KIKI'S KAFE</h1>
   </div>
</header>

<main>
<div class="container">
<!--displays the menu picture for the user-->
 <div class="menu">
    <img src="Images/menu.jpg"> 
 </div>

 <div class="system">

<!--buttons to add items into the users order-->
<button onclick="getFormInput('Brownies', 11)"> Add No.0</button><br>
<button onclick="getFormInput('Egg Tart', 5)"> Add No.1</button><br>
<button onclick="getFormInput('Palmiers', 10)"> Add No.2</button><br>
<button onclick="getFormInput('Strawberry Cream Tart', 6)"> Add No.3</button>
<br>
<br>

<form onsubmit="return false;">
<!--Items that the user adds will be listed with price as they order-->
<div id="userOrder"></div>
<div id="userTotal"></div>
<!--where the user will put a name for their order-->
<label for="nameField">Order For:</label>
   <input type="text" id="nameField" name="formName" placeHolder="Your Name">
<br>
<br>
<!--where user will put in their money so the program can determine if they have enough or not-->
<label for="moneyField">Money:</label>
   <input type="text" id="moneyField" name="formMoney" placeHolder="Your Money">
<br>
<br>
<!--button for the user to submit their order to receive a receipt-->
   <input type="button" onclick="placeOrder()" value=" Place Order">
<!--button for if the user wants to reset/start over with their order-->
   <input type="button" onclick="resetOrder()" value=" Reset Order">
<!--where the users receipt will be displayed-->
<div id="receiptOutput"></div>
</form>


</main>

<footer>
 <div class="footer">
   <h3>References</h3>
   <a href=""
</div>
</footer>




<script src="script.js"></script>
</body>
</html>
