<!DOCTYPE html>
<html>
<head>
<title>ORDER PAGE</title>
<link href="style.css" rel="stylesheet">
<link rel="icon" type="png" href="Images/icon.webp">
</head>
<body>

<header>
   <div class="header">
      <h1>Your Order</h1>
   </div>
</header>

<main>
<div class="container">

 <div class="menu">
    <img src="Images/dtec-menu.jpg"> 
 </div>

 <div class="system">
  

<form onsubmit="return false;">
   <label for="nameField">Order For:</label>
   <input type="text" id="nameField" name="formName" placeHolder="Name">
<br>
   <label for="itemField">Item:</label>
   <input type="text" id="itemField" name="formItem" placeholder="Item Number">
<br>
   <label for="quantityField">Qty:</label>
   <input type="number" id="quantityField" name="formQuantity">
<br>
   <input type="button" onclick="getFormInput()" value="Order">
</form>

</div>

<div id="spaceForJavaScriptOutput">

<script src="script.js"></script>

</div>
</main>

<footer>
 <div class="footer">
   <h3>References</h3>
</div>
</footer>




 
</body>
</html>
